<!DOCTYPE html>
<html>
<head>
    <title>Workshop Registration</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f7f7f7	; }
        form { background: pink; padding: 30px; width: 300px; margin: auto; border-radius: 10px; border: 1px solid black; }
        h2 { text-align: center; }
        input, select { width: 100%; margin: 5px 0; }
        button { background-color: #4CAF50; color: white; padding: 10px; border: none; width: 100%; }
        .errorlist { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Workshop Registration Form</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
</body>
</html>
