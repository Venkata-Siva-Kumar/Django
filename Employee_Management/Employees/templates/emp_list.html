<head>
    <title>Employees</title>
	<style>
		body{
			font-family:Arial; 
			text-align:center; 
		}
		h2 {color:red;}
		
		table{
			border-collapse:collapse; 
			text-align:center;
			width: 90%;
			margin: 0 auto;
		}
		td,th{
			border: 2px  solid black;
			padding: 5px;
		}
		th{
			background-color:green;
			color: white;
		}
		a{
			display:block;
			margin-top: 30px;
		}
	</style>
</head>

<body>
    <h2>Employee List</h2>
    
    <table border="1">
        <tr>
            <th>Employee Number</th>
            <th>Employee Name</th>
            <th>Gender</th>
            <th>Join Date</th>
            <th>Salary</th>
            <th>Dept Number</th>
        </tr>
        {% for emp in employees %}
        <tr>
            <td>{{emp.empno}}</td>
            <td>{{emp.ename}}</td>
            <td>{{emp.get_sex_display}}</td>
            <td>{{emp.join_date}}</td>
            <td>{{emp.salary}}</td>
            <td>{{emp.deptNo}}</td>
        </tr>
        {% endfor %}        
    </table>
    <a href = '{% url 'add_emp' %}'>Add Employee</a>
</body>
