<!DOCTYPE html>
<html>
<head><title>Employee List</title></head>
<body>
    <h2>Employee Records</h2>
    
    <table border="1" cellpadding="5">
        <tr>
			<th>Name</th>
			<th>Email</th>
			<th>Mobile</th>
			<th>Department</th>
			<th>Edit</th>
			<th>Delete</th>
		</tr>
        {% for e in employees %}
        <tr>
            <td>{{ e.name }}</td>
            <td>{{ e.email }}</td>
            <td>{{ e.mobile }}</td>
            <td>{{ e.department }}</td>
            <td>
                <a href="{% url 'edit_employee' e.id %}">Edit</a> 
            </td>
			<td>
                <a href="{% url 'delete_employee' e.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
	
	<a href="{% url 'add_employee' %}">Add Employee</a>
</body>
</html>
