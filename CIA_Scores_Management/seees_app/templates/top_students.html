<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top Students</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 40px;
        }
        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background: rgba(255,255,255,0.1);
        }
        th, td {
            border: 1px solid white;
            padding: 10px;
            text-align: center;
        }
        th {
            background: rgba(255,255,255,0.2);
        }
        a { color: yellow; text-decoration: none; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Top 3 Students in CIA {{ CIA }}</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Marks</th>
            <th>Department</th>
        </tr>
        {% for s in top %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.student_name }}</td>
            <td>{{ s.mark }}</td>
            <td>{{ s.deptID.deptName }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No students found.</td></tr>
        {% endfor %}
    </table>
    <br>
    <div style="text-align:center;">
        <a href="{% url 'home' %}">← Back to Home</a>
    </div>
</body>
</html>
